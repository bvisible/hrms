name: Tests
# Fleet CI for this product fork (wave 2). Mechanics live in bvisible/neoffice-ci
# (frappe-app-ci.yml): bench init on OUR frappe fork, deps, run-tests,
# report to the hub (one [CI] issue per repo, closed by the green).
# Nightly + PR + on demand — not on push: the upstream CI and the build bot
# already run there, a second run per bot commit would only add noise.
on:
  # nightly back on 2026-09-04: #203 closed on a green run of version-15 (916 tests,
  # 0 failures, 0 errors) — it had been paused on 2026-09-03 while the suite was red.
  schedule:
    - cron: "59 4 * * *"
  pull_request:
  workflow_dispatch:
    inputs:
      test_args:
        description: "Extra args for bench run-tests (e.g. --debug-records)"
        required: false
        default: ""
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    uses: bvisible/neoffice-ci/.github/workflows/frappe-app-ci.yml@main
    with:
      app: hrms
      install_apps: erpnext,payments,neoffice_theme   # the fork's tests reach Payment Gateway (payments app)
      erpnext_bootstrap: false   # hrms.tests.test_utils.before_tests does the whole setup itself (_Test Company); erpnext's wizard on top fought it (Wind Power LLC)
      skip_build: true   # SPA commit-the-build: assets committed, never built on instances
      # 904 tests in ONE process: `run-tests --app` never resets frappe.session.user between
      # files (a test ending on set_user(x) killed the next file's setUpClass) and builds every
      # test record in one uncommitted transaction that make_test_objects() rolls back the
      # moment a record already exists (Employee _T-Employee-00002, Shift Type "Day Shift"
      # vanished that way). The parallel runner isolates per file; --total-builds 2 is what
      # upstream frappe/hrms validates this suite with.
      parallel_runner: true
      test_args: ${{ inputs.test_args || '' }}
    # inherit: CI_REPORT_SECRET (deps are public forks: no read token needed)
    secrets: inherit
