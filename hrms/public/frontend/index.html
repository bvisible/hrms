<!DOCTYPE html>
<html lang="en">
	<head>
		<!-- //// Neoffice - source of two artifacts this fork COMMITS: hrms/public/frontend/index.html -->
		<!-- //// (vite outDir) and its copy hrms/www/hrms.html (frontend/package.json, copy-html-entry). -->
		<!-- //// Upstream gitignores both and lets every bench rebuild them; our client instances have -->
		<!-- //// 4 GB of RAM and vite OOMs there, so build-frontend.yml builds in CI and commits the -->
		<!-- //// output - see the .gitignore and package.json markers. Vite copies these comments -->
		<!-- //// verbatim, which is how both artifacts stay marked with no hand-edited build output. -->
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, viewport-fit=cover maximum-scale=1.0, user-scalable=no"
		/>
		<!-- //// Neoffice — upstream: « Frappe HR ». The name of the window when the page is installed, in the reader's language. -->
		<title>{{ _("Human Resources") }}</title>

		<meta name="apple-mobile-web-app-capable" content="yes" />
		<!-- //// Neoffice — upstream's apple-mobile-web-app-title (« Frappe HR ») removed: the template below writes the name. -->
		<meta name="apple-mobile-web-app-status-bar-style" content="white" />
		<!-- required for setting the status bar bg as white -->
		<meta name="theme-color" content="#fff" />

		<!-- PWA -->
		<!-- //// Neoffice — upstream lists here the icons and the launch images of its own brand.
		     //// neoffice_theme writes ours: one template for every application put on a phone's home screen
		     //// (neoffice_theme/home_screen.py). « ignore missing »: without the theme, the page opens with no icon.
		     //// At a merge, upstream's block stays out. -->
		{% set neo_home_screen_app = "hrms" %}
		{% include "neoffice_theme/templates/includes/home_screen_head.html" ignore missing %}
		<script type="module" crossorigin src="/assets/hrms/frontend/assets/index-BjPYN9IX.js"></script>
		<link rel="modulepreload" crossorigin href="/assets/hrms/frontend/assets/frappe-ui-t3J-DXEe.js">
		<link rel="stylesheet" crossorigin href="/assets/hrms/frontend/assets/frappe-ui-IZoKCQSt.css">
		<link rel="stylesheet" crossorigin href="/assets/hrms/frontend/assets/index-C-nGWZhB.css">
	</head>
	<body class="antialiased">
		<div id="app"></div>
		<div id="modals"></div>
		<div id="popovers"></div>

		<script>
			window.csrf_token = "{{ csrf_token }}"
			window.site_name = '{{ site_name }}'
			if (!window.frappe) window.frappe = {}
			frappe.boot = {{ boot }}
		</script>

	</body>
</html>
